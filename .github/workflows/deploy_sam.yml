name: Deploy SAM

on:

  pull_request:
    types: closed
    branches:
      - 'master'
      - 'dev'
      - 'RC*'
      - '1.*'
    paths-ignore:
      - '**.md'
      - '.gitignore'

  workflow_dispatch:

# NAS's deploy_apollo_dev.yml keeps only one pending run per its own
# deploy-apollo-dev group; a second dispatcher arriving while one is already
# pending gets cancelled by GitHub, not by a real failure. Apollo's and
# NULISAseqR_AI's deploy_nas.yml already hit this and added the same guard.
concurrency:
  group: deploy-sam
  cancel-in-progress: true

jobs:

  deploy-sam:
    if: |
      (github.event.pull_request.merged == true && (contains(github.event.pull_request.title, 'deploy nas') || contains(github.event.pull_request.labels.*.name, 'Deploy NAS'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Determine ref and workflow file
        id: get_wf_name
        env:
          # Fall back to ref_name for workflow_dispatch, where base.ref is
          # empty -- without this, the trigger step below gets an empty ref
          # and the downstream action silently substitutes NAS's "main".
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          case "$BASE_REF" in
            dev)
              NAS_REF="port/mcp-client-on-2.0-dev"
              WORKFLOW_FILE="deploy_apollo_dev.yml"
              ;;
            master)
              # NOTE: NAS's main/prod line does not install iheatmapr from a
              # branch at all -- it only comes from the base image's
              # renv.lock pin (deploy_helper.yml has no iheatmapr-branch
              # input; Dockerfile.base installs iheatmapr with no @branch).
              # So this dispatch rebuilds/redeploys NAS prod, but a merge
              # here alone will NOT actually update the iheatmapr code
              # running in it -- that requires a separate renv.lock bump in
              # NAS. Left in place as a safety rebuild trigger, not a real
              # code-deployment path.
              NAS_REF="main"
              WORKFLOW_FILE="deploy_prod.yml"
              ;;
            *)
              NAS_REF="$BASE_REF"
              WORKFLOW_FILE="deploy_dev.yml"
              ;;
          esac
          echo "BASE_REF=$BASE_REF" >> $GITHUB_OUTPUT
          echo "NAS_REF=$NAS_REF" >> $GITHUB_OUTPUT
          echo "WORKFLOW_FILE=$WORKFLOW_FILE" >> $GITHUB_OUTPUT

      - name: Check details
        run: |
          echo "Deploying SAM"
          echo "============="
          echo "Base branch: ${{ steps.get_wf_name.outputs.BASE_REF }}"
          echo "NAS ref: ${{ steps.get_wf_name.outputs.NAS_REF }}"
          echo "Workflow file: ${{ steps.get_wf_name.outputs.WORKFLOW_FILE }}"

      - name: Trigger SAM deployment
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: Alamar-Biosciences
          repo: NULISA-Analysis-Software
          github_token: ${{ secrets.UTILITY_ACCESS_TOKEN }}
          ref: ${{ steps.get_wf_name.outputs.NAS_REF }}
          workflow_file_name: ${{ steps.get_wf_name.outputs.WORKFLOW_FILE }}
          wait_workflow: true
